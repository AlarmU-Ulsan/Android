import java.util.Properties

plugins {
    id 'kotlin-kapt'
    id 'com.google.gms.google-services'
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
}

android {
    namespace 'com.alarmit.alarm_it'
    compileSdk 35
    viewBinding {
        enabled = true
    }

    // 🔹 local.properties에서 URL 읽기
    def props = new Properties()
    def localPropsFile = rootProject.file("local.properties")
    if (localPropsFile.exists()) {
        localPropsFile.withInputStream { props.load(it) }
    }

    def BASE_URL_TEST = props.getProperty("BASE_URL_TEST")
    def BASE_URL_PROD = props.getProperty("BASE_URL_PROD")

    if (!BASE_URL_TEST || !BASE_URL_PROD) {
        throw new GradleException("❌ local.properties에 BASE_URL_TEST 또는 BASE_URL_PROD가 정의되어 있지 않습니다.")
    }

    defaultConfig {
        applicationId "com.alarmit.alarm_it"
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName "1.0.3"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        debug {
            // ✅ 테스트 서버 URL
            buildConfigField "String", "BASE_URL", "\"${BASE_URL_TEST}\""
            versionNameSuffix "-debug"
        }

        release {
            // ✅ 운영 서버 URL
            buildConfigField "String", "BASE_URL", "\"${BASE_URL_PROD}\""
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {

    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.androidx.activity
    implementation libs.androidx.constraintlayout
    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core

    // Retrofit2
    implementation libs.retrofit
    implementation libs.converter.gson
    // Gson
    implementation libs.gson
    // okHttp3
    implementation(platform("com.squareup.okhttp3:okhttp-bom:4.12.0"))
    // define any required OkHttp artifacts without version
    implementation("com.squareup.okhttp3:okhttp")
    implementation("com.squareup.okhttp3:logging-interceptor")
    implementation ("com.squareup.okhttp3:okhttp-urlconnection")

    // Room
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    kapt 'androidx.room:room-compiler:2.6.1'

    // SSE
    implementation "androidx.work:work-runtime-ktx:2.9.0"

    implementation "com.launchdarkly:okhttp-eventsource:4.1.0"

    // FCM
    implementation 'com.google.firebase:firebase-messaging-ktx:23.0.0'
}